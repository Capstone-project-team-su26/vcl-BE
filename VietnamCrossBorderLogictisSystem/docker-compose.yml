name: vcl-backend

networks:
  vcl-net:
    name: vcl-net
    driver: bridge

volumes:
  mssql-data:

services:
  # ---------------------------------------------------------------------
  # SQL Server 2022
  # ---------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vcl-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required (GitHub secret)}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    volumes:
      - mssql-data:/var/opt/mssql
    ports:
      - "127.0.0.1:14333:1433"
    networks:
      - vcl-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------------------------------------------------------------------
  # Backend .NET
  # ---------------------------------------------------------------------
  vcl-api:
    build:
      context: .
      dockerfile: Dockerfile
      labels:
        com.vcl.app: vcl-api
    image: vcl-api:${IMAGE_TAG:-latest}
    container_name: vcl-api
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - vcl-net
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AppDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True;"

      App__PublicBaseUrl: https://api-vcl.vnlogistic.click
      SePay__BaseUrl: https://api-vcl.vnlogistic.click

      GoshipSettings__AllowStatusSimulation: ${GOSHIP_ALLOW_STATUS_SIMULATION:-false}

      JWT__SecretKey: ${JWT_SECRET_KEY}
      PayOS__ClientId: ${PAYOS_CLIENT_ID}
      PayOS__ApiKey: ${PAYOS_API_KEY}
      PayOS__ChecksumKey: ${PAYOS_CHECKSUM_KEY}
      SePay__WebhookSecret: ${SEPAY_WEBHOOK_SECRET}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET}
      MailSettings__Password: ${MAIL_APP_PASSWORD}
      SmtpSettings__Password: ${MAIL_APP_PASSWORD}
      GoshipSettings__ClientSecret: ${GOSHIP_CLIENT_SECRET}
      GoshipSettings__Token: ${GOSHIP_TOKEN}
      OpenRouterSettings__ApiKey: ${OPENROUTER_API_KEY}
      OpenRouterSettings__Model: ${OPENROUTER_MODEL:-google/gemini-2.0-flash-001}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/swagger/v1/swagger.json"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ---------------------------------------------------------------------
  # Cloudflare Tunnel connector (tunnel "vcl-backend").
  # secret CF_TUNNEL_TOKEN; hostname api-vcl.vnlogistic.click → http://vcl-api:8080
  # Cloudflare (Networking → Tunnels → Routes).
  # ---------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required (GitHub secret CF_TUNNEL_TOKEN)}
    networks:
      - vcl-net
    depends_on:
      - vcl-api
