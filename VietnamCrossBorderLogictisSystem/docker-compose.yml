services:
  vcl-api:
    # Deploy dùng image đã build sẵn trên GHCR; build chỉ dành cho máy dev.
    image: ${IMAGE:-vcl-api:local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    # format: raw để compose không interpolate app.env — password chứa $ hay ${...}
    # phải vào container y nguyên. .env chỉ giữ IMAGE/API_PORT/TRAEFIK_ROUTER_RULE.
    env_file:
      - path: app.env
        format: raw
    ports:
      - "${API_PORT:-8085}:8080"
