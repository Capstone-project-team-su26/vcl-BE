name: vcl-backend

networks:
  edge:
    name: vcl-edge
    driver: bridge

services:
  # ---------------------------------------------------------------------
  # Reverse proxy. No ports are published to the host on purpose: the
  # only way in is through the "edge" network, which only cloudflared
  # can reach. That means the server's firewall never needs 80/443 open.
  # ---------------------------------------------------------------------
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=vcl-edge"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=false"
      - "--log.level=INFO"
    networks:
      - edge
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ---------------------------------------------------------------------
  # Cloudflare Tunnel connector. Reads its token from the environment
  # (see .env / GitHub secret CF_TUNNEL_TOKEN). No cloudflared config
  # file needed — the tunnel's public hostnames are configured once in
  # the Cloudflare Zero Trust dashboard (see the runbook).
  # ---------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required (Cloudflare Zero Trust > Tunnels)}
    networks:
      - edge
    depends_on:
      - traefik

  # ---------------------------------------------------------------------
  # The .NET backend. Traefik discovers it via the docker provider using
  # the labels below — nothing to configure on the Traefik side per
  # deploy. Internal port 8080 must match what Kestrel actually listens
  # on inside the container (ASPNETCORE_URLS / launchSettings).
  # ---------------------------------------------------------------------
  vcl-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: vcl-api:${IMAGE_TAG:-latest}
    container_name: vcl-api
    restart: unless-stopped
    networks:
      - edge
    environment:
      ConnectionStrings__DefaultConnection: ${CONNECTIONSTRING}
      JWT__SecretKey: ${JWT_SECRET_KEY}
      PayOS__ClientId: ${PAYOS_CLIENT_ID}
      PayOS__ApiKey: ${PAYOS_API_KEY}
      PayOS__ChecksumKey: ${PAYOS_CHECKSUM_KEY}
      SePay__WebhookSecret: ${SEPAY_WEBHOOK_SECRET}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET}
      MailSettings__Password: ${MAIL_APP_PASSWORD}
      SmtpSettings__Password: ${MAIL_APP_PASSWORD}
      GoshipSettings__ClientSecret: ${GOSHIP_CLIENT_SECRET}
      GoshipSettings__Token: ${GOSHIP_TOKEN}
      OpenRouterSettings__ApiKey: ${OPENROUTER_API_KEY}
    healthcheck:
      # Requires curl inside the runtime image — see the runbook's note
      # on the Dockerfile if this stays "unhealthy".
      test: ["CMD", "curl", "-f", "http://localhost:8080/swagger/v1/swagger.json"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels:
      traefik.enable: "true"
      traefik.http.routers.vcl-api.rule: "Host(`api-vcl.vnlogistic.click`)"
      traefik.http.routers.vcl-api.entrypoints: "web"
      traefik.http.services.vcl-api.loadbalancer.server.port: "8080"
