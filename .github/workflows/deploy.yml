name: Deploy

# Build một lần trên GitHub runner, rồi reconcile hai server độc lập.
# Cron 15 phút để server nào lúc push đang chết thì lần sau tự bắt kịp.
on:
  push:
    branches: [main, dev]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Server cần deploy
        type: choice
        options: [both, zushin, henrytech]
        default: both

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPO: ghcr.io/capstone-project-team-su26/vcl-api

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: build-${{ github.ref_name }}
      cancel-in-progress: true
    outputs:
      image: ${{ env.IMAGE_REPO }}:${{ github.sha }}
      targets: ${{ steps.targets.outputs.list }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deploy targets
        id: targets
        run: |
          case "${{ inputs.target || 'both' }}" in
            zushin)    list='["zushin"]' ;;
            henrytech) list='["henrytech"]' ;;
            *)         list='["zushin","henrytech"]' ;;
          esac
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.ref_name }}
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ${{ matrix.target }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.build.outputs.targets) }}
    concurrency:
      group: deploy-${{ matrix.target }}-${{ github.ref_name }}
      cancel-in-progress: true
    env:
      # Mỗi branch là một stack riêng, cùng cấu trúc trên cả hai server.
      # Cron chỉ chạy trên default branch nên stack dev không bị main ghi đè.
      DEPLOY_DIR: /root/vcl-deploy/${{ github.ref_name }}
      PROJECT: vcl-${{ github.ref_name }}
      API_PORT: ${{ github.ref_name == 'main' && '8085' || '8086' }}
      # Chỉ stack main đứng sau Traefik của zushin và giữ domain công khai.
      USE_TRAEFIK: ${{ matrix.target == 'zushin' && github.ref_name == 'main' }}
    steps:
      - uses: actions/checkout@v4

      # Cả hai server dùng chung đúng bộ secret này, nên .env không thể lệch nhau.
      # Giá trị không bí mật để thẳng ở đây vì chúng vốn đã công khai trong repo.
      - name: Build .env cho server
        env:
          CONNECTIONSTRING: ${{ secrets.CONNECTIONSTRING }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          PAYOS_CLIENT_ID: ${{ secrets.PAYOS_CLIENT_ID }}
          PAYOS_API_KEY: ${{ secrets.PAYOS_API_KEY }}
          PAYOS_CHECKSUM_KEY: ${{ secrets.PAYOS_CHECKSUM_KEY }}
          SEPAY_WEBHOOK_SECRET: ${{ secrets.SEPAY_WEBHOOK_SECRET }}
          GHN_TOKEN: ${{ secrets.GHN_TOKEN }}
          GOSHIP_CLIENT_SECRET: ${{ secrets.GOSHIP_CLIENT_SECRET }}
          GOSHIP_TOKEN: ${{ secrets.GOSHIP_TOKEN }}
          IMAGE: ${{ needs.build.outputs.image }}
          PUBLIC_URL: ${{ matrix.target == 'zushin' && 'https://api-vcl.zushin.io.vn' || 'https://vcl.henrytech.cloud' }}
          TRAEFIK_ROUTER_RULE: ${{ env.USE_TRAEFIK == 'true' && 'Host(`api-vcl.zushin.io.vn`) || Host(`api-vcl2.zushin.io.vn`)' || '' }}
        run: |
          missing=
          for name in CONNECTIONSTRING JWT_SECRET_KEY MAIL_APP_PASSWORD \
                      CLOUDINARY_API_KEY CLOUDINARY_API_SECRET \
                      PAYOS_CLIENT_ID PAYOS_API_KEY PAYOS_CHECKSUM_KEY \
                      SEPAY_WEBHOOK_SECRET GHN_TOKEN \
                      GOSHIP_CLIENT_SECRET GOSHIP_TOKEN; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Thiếu secret:$missing (xem docs/FAILOVER.md)." >&2
            exit 1
          fi

          app_env=$(
            cat <<EOF
          ASPNETCORE_ENVIRONMENT=Production
          ASPNETCORE_URLS=http://+:8080

          # Domain that server dung de dung link cong khai (phieu ky gui PDF...).
          # Thieu bien nay thi app roi ve gia tri trong appsettings.json va sinh link
          # tro sang server khac.
          App__PublicBaseUrl=$PUBLIC_URL

          ConnectionStrings__DefaultConnection=$CONNECTIONSTRING

          JWT__SecretKey=$JWT_SECRET_KEY
          JWT__ValidIssuer=vcl-system
          JWT__ValidAudience=vcl-clients
          JWT__TokenValidityInMinutes=240

          MailSettings__Host=smtp.gmail.com
          MailSettings__Port=587
          MailSettings__SenderEmail=vietnamcrossborderlogictis@gmail.com
          MailSettings__SenderName=VCL System
          MailSettings__Username=vietnamcrossborderlogictis@gmail.com
          MailSettings__Password=$MAIL_APP_PASSWORD
          MailSettings__UseSsl=false

          SmtpSettings__Host=smtp.gmail.com
          SmtpSettings__Port=587
          SmtpSettings__EnableSsl=true
          SmtpSettings__Username=vietnamcrossborderlogictis@gmail.com
          SmtpSettings__Password=$MAIL_APP_PASSWORD

          Cloudinary__CloudName=penyhvpn
          Cloudinary__ApiKey=$CLOUDINARY_API_KEY
          Cloudinary__ApiSecret=$CLOUDINARY_API_SECRET

          PayOS__ClientId=$PAYOS_CLIENT_ID
          PayOS__ApiKey=$PAYOS_API_KEY
          PayOS__ChecksumKey=$PAYOS_CHECKSUM_KEY
          PayOS__ReturnUrl=https://logictic.site/payment/success
          PayOS__CancelUrl=https://logictic.site/payment/cancel

          SePay__AccountNumber=0937250343
          SePay__BankName=mbbank
          SePay__AccountName=Thái Công Đạt
          SePay__WebhookSecret=$SEPAY_WEBHOOK_SECRET
          SePay__ReturnUrl=https://logictic.site/payment/success
          SePay__CancelUrl=https://logictic.site/payment/cancel
          SePay__BaseUrl=$PUBLIC_URL

          GHNSettings__ApiUrl=https://online-gateway.ghn.vn/shiip/public-api/v2/
          GHNSettings__Token=$GHN_TOKEN
          GHNSettings__ShopId=6575712
          GHNSettings__MaxInsuranceValue=5000000
          GHNSettings__WebhookUrl=$PUBLIC_URL/api/ghn/webhook

          GoshipSettings__ApiUrl=https://sandbox.goship.io/api/v2/
          GoshipSettings__ClientId=305
          GoshipSettings__ClientSecret=$GOSHIP_CLIENT_SECRET
          GoshipSettings__Token=$GOSHIP_TOKEN
          EOF
          )

          compose_env=$(
            cat <<EOF
          IMAGE=$IMAGE
          API_PORT=$API_PORT
          TRAEFIK_ROUTER_RULE=$TRAEFIK_ROUTER_RULE
          EOF
          )

          app_b64=$(printf '%s\n' "$app_env" | base64 -w0)
          echo "::add-mask::$app_b64"
          {
            echo "APP_ENV_B64=$app_b64"
            echo "COMPOSE_ENV_B64=$(printf '%s\n' "$compose_env" | base64 -w0)"
          } >> "$GITHUB_ENV"

      - name: Tạo thư mục deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ matrix.target == 'zushin' && secrets.ZUSHIN_HOST || secrets.HOST }}
          username: ${{ matrix.target == 'zushin' && secrets.ZUSHIN_USER_NAME || secrets.USER_NAME }}
          password: ${{ matrix.target == 'zushin' && secrets.ZUSHIN_PASS_WORD || secrets.PASS_WORD }}
          port: 22
          script: mkdir -p ${{ env.DEPLOY_DIR }}

      - name: Upload compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ matrix.target == 'zushin' && secrets.ZUSHIN_HOST || secrets.HOST }}
          username: ${{ matrix.target == 'zushin' && secrets.ZUSHIN_USER_NAME || secrets.USER_NAME }}
          password: ${{ matrix.target == 'zushin' && secrets.ZUSHIN_PASS_WORD || secrets.PASS_WORD }}
          port: 22
          source: VietnamCrossBorderLogictisSystem/docker-compose.yml,VietnamCrossBorderLogictisSystem/docker-compose.traefik.yml
          target: ${{ env.DEPLOY_DIR }}
          strip_components: 1
          overwrite: true

      - name: Reconcile
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          COMPOSE_FILES: ${{ env.USE_TRAEFIK == 'true' && '-f docker-compose.yml -f docker-compose.traefik.yml' || '-f docker-compose.yml' }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ matrix.target == 'zushin' && secrets.ZUSHIN_HOST || secrets.HOST }}
          username: ${{ matrix.target == 'zushin' && secrets.ZUSHIN_USER_NAME || secrets.USER_NAME }}
          password: ${{ matrix.target == 'zushin' && secrets.ZUSHIN_PASS_WORD || secrets.PASS_WORD }}
          port: 22
          command_timeout: 12m
          envs: DEPLOY_DIR,PROJECT,APP_ENV_B64,COMPOSE_ENV_B64,IMAGE,API_PORT,COMPOSE_FILES,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu
            cd "$DEPLOY_DIR"

            umask 077
            printf '%s' "$APP_ENV_B64" | base64 -d > app.env.new
            printf '%s' "$COMPOSE_ENV_B64" | base64 -d > .env.new

            env_changed=no
            for f in app.env .env; do
              if [ ! -f "$f" ] || ! cmp -s "$f" "$f.new"; then
                env_changed=yes
              fi
              mv "$f.new" "$f"
            done

            compose() {
              docker compose $COMPOSE_FILES -p "$PROJECT" "$@"
            }

            # env_file.format: raw cần Compose >= 2.30, thiếu thì báo rõ thay vì lỗi schema khó hiểu.
            compose_version=$(docker compose version --short | sed 's/^v//')
            if [ "$(printf '%s\n2.30.0\n' "$compose_version" | sort -V | head -n1)" != 2.30.0 ]; then
              echo "Docker Compose tren server la $compose_version, can >= 2.30. Nang cap docker-compose-plugin." >&2
              exit 1
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE"
            compose config --quiet

            # So sanh bang image digest nen khong can luu dau moc phien ban tren server.
            want=$(docker image inspect --format '{{.Id}}' "$IMAGE")

            # -a de tinh ca container da dung: `ps -q` chi liet ke container dang chay,
            # container exited se bi bo sot va `compose up` sau do dung ten -> loi Conflict.
            cid=$(compose ps -aq vcl-api 2>/dev/null || true)
            running=none
            container_state=none
            if [ -n "$cid" ]; then
              running=$(docker inspect --format '{{.Image}}' "$cid")
              container_state=$(docker inspect --format '{{.State.Status}}' "$cid")
            fi

            # Chi bo qua khi container that su dang chay dung image va cau hinh khong doi.
            if [ "$want" = "$running" ] && [ "$container_state" = running ] && [ "$env_changed" = no ]; then
              echo "Da dong bo voi $IMAGE va cau hinh khong doi, bo qua."
              exit 0
            fi

            rollback_tag="vcl-api:previous-$PROJECT"
            if [ "$running" != none ]; then
              docker tag "$running" "$rollback_tag"
            fi

            # Den day la chac chan phai trien khai ban moi, nen xoa sach moi container
            # cua service truoc khi tao lai. Khong loai tru container compose dang theo doi:
            # luc recreate, compose doi ten container cu thanh "<short-id>_<ten-goc>" nhung
            # van giu nhan compose, nen `compose ps` co the tra ve chinh cai xac do —
            # loai tru theo ID se bo sot dung cai gay Conflict.
            existing=$(docker ps -aq --no-trunc --filter "name=${PROJECT}-vcl-api" || true)
            if [ -n "$existing" ]; then
              for c in $existing; do
                echo "Xoa container cu $(docker inspect --format '{{.Name}}' "$c")."
                docker rm -f "$c" > /dev/null
              done
            fi

            # Khong con container nao ton tai nen compose tao moi hoan toan, khong recreate.
            compose up -d --remove-orphans

            health_url="http://127.0.0.1:$API_PORT/swagger/v1/swagger.json"
            attempt=1
            while [ "$attempt" -le 12 ]; do
              if curl --fail --silent --show-error --max-time 10 "$health_url" > /dev/null; then
                echo "Deploy $IMAGE thanh cong."
                compose ps

                # Moi commit tao mot image tag rieng; khong don thi o dia day dan
                # den muc sshd va docker deu khong phuc vu duoc.
                docker image prune -af --filter "until=72h" > /dev/null 2>&1 || true

                exit 0
              fi
              echo "Cho API san sang ($attempt/12)..."
              sleep 5
              attempt=$((attempt + 1))
            done

            echo "Health check that bai." >&2
            compose logs --tail=100 vcl-api

            if docker image inspect "$rollback_tag" > /dev/null 2>&1; then
              echo "Rollback ve $rollback_tag." >&2
              export IMAGE="$rollback_tag"
              compose up -d
            fi
            exit 1
