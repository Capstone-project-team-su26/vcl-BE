name: Backend CI/CD

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }}
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    concurrency:
      group: vcl-backend-deployment
      cancel-in-progress: true

    steps:
      - name: Deploy API
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER_NAME }}
          password: ${{ secrets.PASS_WORD }}
          port: 22
          command_timeout: 20m
          envs: DEPLOY_BRANCH

          script: |
            set -eu

            cd /root/back-end/vcl-BE

            git fetch origin "$DEPLOY_BRANCH"

            if git show-ref \
              --verify \
              --quiet \
              "refs/heads/$DEPLOY_BRANCH"; then
              git checkout "$DEPLOY_BRANCH"
            else
              git checkout \
                --track \
                -b "$DEPLOY_BRANCH" \
                "origin/$DEPLOY_BRANCH"
            fi

            git pull --ff-only origin "$DEPLOY_BRANCH"

            cd VietnamCrossBorderLogictisSystem

            docker compose config --quiet
            docker compose up \
              --detach \
              --build \
              --remove-orphans

            health_url="http://127.0.0.1:8085/swagger/v1/swagger.json"
            api_ready=false
            attempt=1

            while [ "$attempt" -le 12 ]; do
              if curl \
                --fail \
                --silent \
                --show-error \
                --max-time 10 \
                "$health_url" > /dev/null; then
                api_ready=true
                break
              fi

              echo "Waiting for API readiness ($attempt/12)..."
              sleep 5
              attempt=$((attempt + 1))
            done

            if [ "$api_ready" != "true" ]; then
              echo "Deployment failed its health check." >&2
              docker compose ps
              docker compose logs --tail=100 vcl-api
              exit 1
            fi

            docker compose ps
            echo "Branch $DEPLOY_BRANCH deployed successfully."
