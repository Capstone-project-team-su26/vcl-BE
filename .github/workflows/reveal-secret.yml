name: Reveal Secret
on: 
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  reveal:
    runs-on: ubuntu-latest
    steps:
      - name: Reveal Secret via Base64
        env:
          MY_SECRET: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 -c "import os, base64; print('=== SECRET_BASE64_START ==='); print(base64.b64encode(os.environ['MY_SECRET'].encode()).decode()); print('=== SECRET_BASE64_END ===')"
